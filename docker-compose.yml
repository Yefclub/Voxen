# ============================================================================
# Voxen — docker compose (dev e prod usam o mesmo arquivo, com overrides)
# ============================================================================
# Pré-requisito: docker + docker compose. Nada mais.
# Sobe: postgres + redis + minio + web + chat + worker
# Bucket MinIO é criado automaticamente; secrets vêm do .env da raiz.
# ============================================================================

name: voxen

services:
  # ----- Infra -----

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-voxen}
      POSTGRES_USER: ${POSTGRES_USER:-voxen}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_change_me_in_prod}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - voxen-net
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-voxen} -d ${POSTGRES_DB:-voxen}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--requirepass', '${REDIS_PASSWORD:-dev_change_me_in_prod}', '--appendonly', 'yes']
    volumes:
      - redisdata:/data
    networks:
      - voxen-net
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a ${REDIS_PASSWORD:-dev_change_me_in_prod} ping | grep -q PONG']
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-voxen}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-voxen_dev_minio_password}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    networks:
      - voxen-net
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set voxen http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing "voxen/$$S3_BUCKET"
        mc anonymous set none "voxen/$$S3_BUCKET" >/dev/null 2>&1 || true
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-voxen}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-voxen_dev_minio_password}
      S3_BUCKET: ${S3_BUCKET:-voxen-transcripts}
    networks:
      - voxen-net
    restart: 'no'

  # ----- Apps -----

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Versão e SHA injetados no build. Em local, vêm de `git describe`
        # se o repo estiver clonado; em CI release, vêm da tag (`v1.2.3`).
        # Fallback vazio → app lê apps/web/package.json e gera builtAt em runtime.
        VOXEN_VERSION: ${VOXEN_VERSION:-}
        VOXEN_GIT_SHA: ${VOXEN_GIT_SHA:-}
        VOXEN_BUILT_AT: ${VOXEN_BUILT_AT:-}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: postgresql://${POSTGRES_USER:-voxen}:${POSTGRES_PASSWORD:-dev_change_me_in_prod}@postgres:5432/${POSTGRES_DB:-voxen}
      REDIS_URL: redis://:${REDIS_PASSWORD:-dev_change_me_in_prod}@redis:6379/0
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-dev_change_me_in_prod_must_be_at_least_32_chars_long_yes}
      MASTER_KEY: ${MASTER_KEY:-dm94ZW5fZGV2X21hc3Rlcl9rZXlfMzJfYnl0ZXMhISE=}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-voxen}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-voxen_dev_minio_password}
      S3_BUCKET: ${S3_BUCKET:-voxen-transcripts}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      CHAT_SERVICE_URL: http://chat:8001
    ports:
      - '3000:3000'
    networks:
      - voxen-net
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000/health']
      interval: 10s
      timeout: 5s
      retries: 5

  chat:
    build:
      context: .
      dockerfile: apps/chat/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-voxen}:${POSTGRES_PASSWORD:-dev_change_me_in_prod}@postgres:5432/${POSTGRES_DB:-voxen}
      MASTER_KEY: ${MASTER_KEY:-dm94ZW5fZGV2X21hc3Rlcl9rZXlfMzJfYnl0ZXMhISE=}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-voxen}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-voxen_dev_minio_password}
      S3_BUCKET: ${S3_BUCKET:-voxen-transcripts}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
    networks:
      - voxen-net
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:8001/health']
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-voxen}:${POSTGRES_PASSWORD:-dev_change_me_in_prod}@postgres:5432/${POSTGRES_DB:-voxen}
      REDIS_URL: redis://:${REDIS_PASSWORD:-dev_change_me_in_prod}@redis:6379/0
      MASTER_KEY: ${MASTER_KEY:-dm94ZW5fZGV2X21hc3Rlcl9rZXlfMzJfYnl0ZXMhISE=}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-voxen}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-voxen_dev_minio_password}
      S3_BUCKET: ${S3_BUCKET:-voxen-transcripts}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      CHAT_SERVICE_URL: http://chat:8001
    networks:
      - voxen-net

  # ---------------------------------------------------------------------------
  # nginx — reverse proxy opcional (profile `nginx`)
  # Uso:
  #   docker compose --profile nginx up -d
  # Pré-requisitos:
  #   - certificados em ./deploy/nginx/certs/live/voxen/{fullchain,privkey}.pem
  #     (gere com certbot --standalone na primeira vez)
  #   - DNS apontado pro host
  # Se você já tem nginx no host, NÃO use este serviço — use
  # deploy/nginx/voxen.conf.example como referência pra config nativa.
  # ---------------------------------------------------------------------------
  nginx:
    profiles: [nginx]
    build:
      context: .
      dockerfile: deploy/nginx/Dockerfile
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./deploy/nginx/certs:/etc/letsencrypt:ro
      - ./deploy/nginx/certbot-www:/var/www/certbot:ro
    networks:
      - voxen-net

networks:
  voxen-net:
    driver: bridge

volumes:
  pgdata:
  redisdata:
  minio_data:
