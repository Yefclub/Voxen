[project]
name = "voxen-chat"
version = "0.0.0"
description = "Voxen chat service — FastAPI + Agno"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "agno>=0.5.0",
    "openai>=1.50.0",
    "httpx>=0.27.0",
    "asyncpg>=0.30.0",
    "pydantic>=2.9.0",
    "cryptography>=43.0.0",
    "structlog>=24.4.0",
    "aioboto3>=15.5.0",
    "redis>=5.0.0",
]

[dependency-groups]
dev = [
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "UP", "S", "ASYNC"]
ignore = ["S101"]  # assert usage in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true
# Bibliotecas sem `py.typed` ou stubs públicos. `ignore_missing_imports` cobre
# `import-not-found` mas NÃO `import-untyped` (módulo instalado, sem stubs),
# que mypy strict trata como erro. Desligamos esse código globalmente.
disable_error_code = ["import-untyped"]

[[tool.mypy.overrides]]
module = ["asyncpg.*", "aioboto3.*", "botocore.*", "redis.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
