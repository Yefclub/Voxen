<!doctype html>
<html lang="pt-BR" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#141a18" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Voxen" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Voxen</title>
    <meta
      name="description"
      content="Sua base de conhecimento. Capture, conecte e reencontre o que importa."
    />

    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="mask-icon" href="/voxen-256.png" color="#34d399" />

    <link rel="preload" href="/fonts/inter.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('voxen:theme');
          var t = saved
            ? saved === 'light'
              ? 'light'
              : 'dark'
            : matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark';
          document.documentElement.dataset.theme = t;
          document.documentElement.style.colorScheme = t;
          document
            .querySelector('meta[name="theme-color"]')
            ?.setAttribute('content', t === 'light' ? '#f8f9f6' : '#141a18');
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="font-sans antialiased">
    <div id="root"></div>
    <script type="module" src="/src/client/main.tsx"></script>
  </body>
</html>
