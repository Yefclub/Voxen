[project]
name = "voxen-worker"
version = "0.0.0"
description = "Voxen worker — media extraction + ffmpeg + OpenRouter + S3-compatible storage"
requires-python = ">=3.13,<3.14"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    "asyncpg>=0.30.0",
    "aioboto3>=13.2.0",
    "redis>=5.2.0",
    "structlog>=24.4.0",
    "cryptography>=48.0.1",
    "pyyaml>=6.0.2",
    "trafilatura>=2.0.0",
    "markitdown[all]>=0.1.3",
    "youtube-transcript-api>=1.0.3,<1.1.dev0",
    "bgutil-ytdlp-pot-provider>=1.3.1",
    "yt-dlp[default,deno]>=2026.6.9",
]

[dependency-groups]
dev = [
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "types-pyyaml>=6.0.12",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "UP", "S", "ASYNC"]
# ASYNC240: Path.glob/read_text em função async — usamos asyncio.to_thread
# antes; o glob/read_text rodam sobre arquivos locais já materializados.
ignore = ["S101", "ASYNC240"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.13"
strict = true
# Bibliotecas sem `py.typed` ou stubs públicos (yt-dlp, aioboto3, asyncpg...).
# `ignore_missing_imports` cobre `import-not-found` mas NÃO `import-untyped`,
# que mypy strict trata como erro. Desligamos esse código globalmente.
disable_error_code = ["import-untyped"]

[[tool.mypy.overrides]]
module = [
    "yt_dlp.*",
    "youtube_transcript_api.*",
    "moto.*",
    "aioboto3.*",
    "botocore.*",
    "asyncpg.*",
    "boto3.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
