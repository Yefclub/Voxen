# ============================================================================
# version-dev — bump package.json para X.Y.Z-dev.<unix> no merge em dev
# ============================================================================
# Estilo Orbital: cada push em `dev` (merge de PR) gera commit
#   chore: set version to X.Y.Z-dev.<timestamp> for dev
# nos package.json (raiz + apps/web) e consome changelog/unreleased/*.md
# para releases.json + CHANGELOG.md.
# ============================================================================

name: Dev version bump

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

env:
  TARGET_BRANCH: dev

concurrency:
  group: version-dev-${{ github.repository }}-dev
  cancel-in-progress: false

jobs:
  version-dev:
    runs-on: ubuntu-latest
    # Evita loop: não re-bump se o push já for o commit/PR do bot de versão.
    # Aspas externas obrigatórias: o ":" em "chore: set version" quebra o YAML.
    # Branch protection exige PR — o bot abre PR + auto-merge (não pusha em dev).
    if: "${{ github.ref_name == 'dev' && (github.event_name == 'workflow_dispatch' || (github.event.head_commit != null && !startsWith(github.event.head_commit.message, 'chore: set version to '))) }}"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync branch with remote
        run: |
          set -euo pipefail
          git fetch origin "$TARGET_BRANCH"
          git checkout -- . 2>/dev/null || true
          git pull --rebase origin "$TARGET_BRANCH"

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Add or refresh -dev.timestamp in version
        id: version
        run: |
          set -euo pipefail
          VER=$(node -p "require('./package.json').version")
          BASE_VER=${VER%-dev*}
          TS=$(date -u +%s)
          NEW_VER="${BASE_VER}-dev.${TS}"
          echo "version=$NEW_VER" >> "$GITHUB_OUTPUT"
          export NEW_VER
          node -e '
            const fs = require("fs");
            const files = ["./package.json", "./apps/web/package.json"];
            for (const f of files) {
              if (!fs.existsSync(f)) continue;
              const j = JSON.parse(fs.readFileSync(f, "utf8"));
              j.version = process.env.NEW_VER;
              fs.writeFileSync(f, JSON.stringify(j, null, 2) + "\n");
            }
          '
          echo "Set version to $NEW_VER"

      - name: Changelog (dev, best-effort)
        continue-on-error: true
        env:
          NEW_VER: ${{ steps.version.outputs.version }}
          RN_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -uo pipefail
          RN_SCRIPT="scripts/release-notes.mjs"
          if [ ! -f "$RN_SCRIPT" ]; then
            echo "[changelog] scripts/release-notes.mjs ausente — pulando."
            exit 0
          fi
          LAST_BUMP=$(git log --first-parent --format='%H%x09%s' -n 400 \
            | awk -F'\t' '!f && $2 ~ /^chore: set version to .* for dev$/ {print $1; f=1}')
          if [ -n "$LAST_BUMP" ]; then
            COMMITS=$(git log --reverse --first-parent --format=%H "${LAST_BUMP}..HEAD")
          else
            # Repo sem bump ainda: varre os últimos merges first-parent.
            COMMITS=$(git log --reverse --first-parent --format=%H -n 80)
          fi
          QUEUE=""
          for sha in $COMMITS; do
            FILES=$(git diff-tree -m --first-parent --no-commit-id --diff-filter=A --name-only -r "$sha" -- changelog/unreleased)
            [ -z "$FILES" ] && continue
            SUBJ=$(git log -1 --format=%s "$sha")
            PR_NUM=""
            if [[ "$SUBJ" =~ \(#([0-9]+)\)[[:space:]]*$ ]]; then
              PR_NUM="${BASH_REMATCH[1]}"
            elif [[ "$SUBJ" =~ ^Merge\ pull\ request\ \#([0-9]+) ]]; then
              PR_NUM="${BASH_REMATCH[1]}"
            fi
            AUTHOR=$(git log -1 --format=%an "$sha")
            CDATE=$(git log -1 --format=%cI "$sha")
            for f in $FILES; do
              case "$f" in *.md) ;; *) continue ;; esac
              [ -f "$f" ] || continue
              QUEUE=$(printf '%s\n' "$QUEUE" | awk -v p="$f|" 'index($0, p) != 1')
              QUEUE="${QUEUE}
          $f|$PR_NUM|$CDATE|$AUTHOR"
            done
          done
          # Sobras no working tree (commits squashed que o range perdeu):
          # consome qualquer .md ainda em unreleased/ não enfileirado.
          for f in changelog/unreleased/*.md; do
            [ -f "$f" ] || continue
            case "$f" in *.md) ;; *) continue ;; esac
            if printf '%s\n' "$QUEUE" | awk -v p="$f|" 'index($0, p) == 1 {found=1} END{exit !found}'; then
              continue
            fi
            QUEUE="${QUEUE}
          $f|||github-actions[bot]"
          done
          COUNT=0
          CONSUMED=""
          while IFS='|' read -r f PR_NUM CDATE AUTHOR; do
            f=$(printf '%s' "$f" | sed 's/^[[:space:]]*//')
            [ -z "$f" ] && continue
            if RN_SOURCE="$f" RN_VERSION="$NEW_VER" RN_PR="$PR_NUM" RN_AUTHOR="$AUTHOR" \
               RN_DATE="${CDATE:-$(date -u +%Y-%m-%dT%H:%M:%SZ)}" node "$RN_SCRIPT" add-dev; then
              COUNT=$((COUNT + 1))
              CONSUMED="$CONSUMED $f"
            fi
          done < <(printf '%s\n' "$QUEUE")
          if [ -n "$CONSUMED" ]; then
            git rm -q --ignore-unmatch $CONSUMED 2>/dev/null || true
          fi
          echo "[changelog] $COUNT entrada(s) consumida(s) desde ${LAST_BUMP:-inicio}"
      - name: Commit on branch, open PR, auto-merge
        env:
          NEW_VER: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json apps/web/package.json
          git add releases.json CHANGELOG.md 2>/dev/null || true
          git add -A changelog 2>/dev/null || true
          git checkout -- . 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No version change, skip commit"
            exit 0
          fi

          # Uma PR criada com GITHUB_TOKEN não dispara `pull_request` (proteção
          # anti-loop do Actions). Antes, ela ficava sem checks e bloqueava para
          # sempre todos os bumps seguintes. Substituímos qualquer bump pendente
          # por um novo snapshot completo do `dev` atual.
          OPEN_URLS=$(gh pr list --base "$TARGET_BRANCH" --state open --json title,url --jq \
            '.[] | select(.title | startswith("chore: set version to ")) | .url')
          while IFS= read -r OPEN_URL; do
            [ -z "$OPEN_URL" ] && continue
            echo "Fechando bump obsoleto: $OPEN_URL"
            gh pr close "$OPEN_URL" --delete-branch || gh pr close "$OPEN_URL"
          done <<< "$OPEN_URLS"

          BRANCH="chore/version-dev-${NEW_VER//./-}"
          git commit -m "chore: set version to $NEW_VER for dev"
          git checkout -B "$BRANCH"
          git push -u origin "$BRANCH" --force

          PR_URL=$(gh pr create --base "$TARGET_BRANCH" --head "$BRANCH" \
            --title "chore: set version to $NEW_VER for dev" \
            --body "Bump automático de versão em dev (\`$NEW_VER\`) + consumo de changelog/unreleased.")
          echo "PR: $PR_URL"

          # `workflow_dispatch` é uma das exceções que o GitHub permite disparar
          # com GITHUB_TOKEN. Assim os required checks são registrados no SHA da
          # branch mesmo que a criação da PR não gere evento pull_request.
          gh workflow run ci.yml --ref "$BRANCH"

          # Fail-closed: exige os 7 checks obrigatórios registrados, concluídos e
          # verdes no head atual antes do merge. Rollup vazio nunca é sucesso.
          HEAD_SHA=$(git rev-parse HEAD)
          for attempt in $(seq 1 70); do
            PR_HEAD=$(gh pr view "$PR_URL" --json headRefOid --jq .headRefOid)
            TOTAL=$(gh pr view "$PR_URL" --json statusCheckRollup --jq \
              '[.statusCheckRollup[] | select(.name == "docker-compose validate" or .name == "Lint TS (apps/web)" or .name == "Typecheck TS (apps/web)" or .name == "Test TS (apps/web)" or .name == "Lint Python (apps/worker)" or .name == "Test Python (apps/worker)" or .name == "Docker build (apps + Easypanel)")] | unique_by(.name) | length')
            PENDING=$(gh pr view "$PR_URL" --json statusCheckRollup --jq \
              '[.statusCheckRollup[] | select((.name == "docker-compose validate" or .name == "Lint TS (apps/web)" or .name == "Typecheck TS (apps/web)" or .name == "Test TS (apps/web)" or .name == "Lint Python (apps/worker)" or .name == "Test Python (apps/worker)" or .name == "Docker build (apps + Easypanel)") and .status != "COMPLETED")] | length')
            FAILED=$(gh pr view "$PR_URL" --json statusCheckRollup --jq \
              '[.statusCheckRollup[] | select((.name == "docker-compose validate" or .name == "Lint TS (apps/web)" or .name == "Typecheck TS (apps/web)" or .name == "Test TS (apps/web)" or .name == "Lint Python (apps/worker)" or .name == "Test Python (apps/worker)" or .name == "Docker build (apps + Easypanel)") and (.conclusion == "FAILURE" or .conclusion == "CANCELLED" or .conclusion == "TIMED_OUT" or .conclusion == "ACTION_REQUIRED"))] | length')
            if [ "$PR_HEAD" != "$HEAD_SHA" ]; then
              echo "Head da PR divergiu do snapshot esperado ($PR_HEAD != $HEAD_SHA)."
              exit 1
            fi
            if [ "${FAILED:-0}" != "0" ]; then
              echo "CI do bump falhou. PR mantida aberta para diagnóstico."
              exit 1
            fi
            if [ "${TOTAL:-0}" -ge 7 ] && [ "${PENDING:-1}" = "0" ]; then
              echo "Required checks verdes e registrados no head $HEAD_SHA."
              break
            fi
            if [ "$attempt" = "70" ]; then
              echo "Timeout aguardando required checks. PR mantida aberta."
              exit 1
            fi
            sleep 30
          done

          for attempt in $(seq 1 20); do
            STATE=$(gh pr view "$PR_URL" --json mergeStateStatus --jq .mergeStateStatus)
            if [ "$STATE" = "CLEAN" ]; then
              gh pr merge --squash --delete-branch "$PR_URL"
              break
            fi
            if [ "$attempt" = "20" ]; then
              echo "PR não ficou CLEAN após os checks (estado: $STATE)."
              exit 1
            fi
            sleep 15
          done

          {
            echo "## Dev version"
            echo ""
            echo "- Versão: \`$NEW_VER\`"
            echo "- PR: $PR_URL"
          } >> "$GITHUB_STEP_SUMMARY"
