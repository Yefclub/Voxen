# ============================================================================
# version-dev — cria tag pre-release vX.Y.Z-dev.N em cada merge em dev
# ============================================================================
# Estratégia OSS-friendly (sem PAT, sem bypass de branch protection):
#  - Roda em push pra `dev` (depois de merge de PR).
#  - Lê a última tag do repo via `git tag --list 'v*' --sort=-v:refname`.
#  - Se for pre-release `vX.Y.Z-dev.N` → incrementa N.
#  - Se for estável `vX.Y.Z` → começa nova série `vX.(Y+1).0-dev.1`.
#  - Cria SÓ TAG. NÃO modifica `package.json` nem faz commit em dev.
#    Tag não esbarra em branch protection (protections cobrem branches,
#    não tags). Funciona com `GITHUB_TOKEN` padrão.
#  - A versão é lida pelas imagens via `git describe --tags --abbrev=0`
#    durante o build (apps/*/Dockerfile) e exposta em runtime via
#    `/api/version` (apps/web/src/index.ts).
#  - Pre-release NÃO dispara release.yml (esse filtra `v[0-9]+.[0-9]+.[0-9]+`
#    sem hífen).
# ============================================================================

name: Version dev on merge

on:
  push:
    branches: [dev]

permissions:
  contents: write

jobs:
  version-dev:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute new pre-release tag
        id: version
        run: |
          set -euo pipefail
          # Fonte da verdade = última tag do repo. Funciona em qualquer cenário.
          LAST_TAG=$(git tag --list 'v*' --sort=-v:refname | head -n1)
          if [[ -z "$LAST_TAG" ]]; then
            BASE_VER=$(node -p "require('./package.json').version")
          else
            BASE_VER="${LAST_TAG#v}"
          fi
          NEW_VER=$(BASE_VER="$BASE_VER" node -e "
            const cur = process.env.BASE_VER;
            const m = cur.match(/^(\d+)\.(\d+)\.(\d+)(?:-dev\.(\d+))?$/);
            if (!m) { console.error('Versão inválida: ' + cur); process.exit(1); }
            const [, major, minor, patch, devN] = m;
            if (devN) {
              console.log(\`\${major}.\${minor}.\${patch}-dev.\${Number(devN) + 1}\`);
            } else {
              console.log(\`\${major}.\${Number(minor) + 1}.0-dev.1\`);
            }
          ")
          echo "new_tag=v$NEW_VER" >> "$GITHUB_OUTPUT"
          echo "Bumping dev to v$NEW_VER (last tag: $LAST_TAG)"

      - name: Create + push tag
        env:
          NEW_TAG: ${{ steps.version.outputs.new_tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse "$NEW_TAG" >/dev/null 2>&1; then
            echo "Tag $NEW_TAG já existe, pulando."
            exit 0
          fi
          git tag -a "$NEW_TAG" -m "Pre-release $NEW_TAG"
          git push origin "$NEW_TAG"
          echo "Pushed $NEW_TAG"
