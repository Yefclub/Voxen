# ============================================================================
# version-dev — bumps package.json to X.Y.Z-dev.<unix> after a dev merge
# ============================================================================
# Every push to `dev` from a merged PR generates:
#   set version to X.Y.Z-dev.<timestamp>
# in the root and web package files, then consumes changelog/unreleased/*.md
# into releases.json and CHANGELOG.md.
# ============================================================================

name: Dev version bump

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

env:
  TARGET_BRANCH: dev

concurrency:
  group: version-dev-${{ github.repository }}-dev
  cancel-in-progress: false

jobs:
  version-dev:
    runs-on: ubuntu-latest
    # Avoid loops when the push already is the version bot commit or PR.
    # Accept both the current subject and the legacy `chore:` prefix.
    # Branch protection requires the bot to open and merge a PR.
    if: >-
      ${{ github.ref_name == 'dev' && (github.event_name == 'workflow_dispatch' ||
      (github.event.head_commit != null &&
      !startsWith(github.event.head_commit.message, 'set version to ') &&
      !startsWith(github.event.head_commit.message, 'chore: set version to '))) }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync branch with remote
        run: |
          set -euo pipefail
          git fetch origin "$TARGET_BRANCH"
          git fetch origin main:refs/remotes/origin/main
          git checkout -- . 2>/dev/null || true
          git pull --rebase origin "$TARGET_BRANCH"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Add or refresh -dev.timestamp in version
        id: version
        run: |
          set -euo pipefail
          VER=$(node -p "require('./package.json').version")
          MAIN_VER=$(git show origin/main:package.json | node -e '
            let input = "";
            process.stdin.on("data", (chunk) => (input += chunk));
            process.stdin.on("end", () => process.stdout.write(JSON.parse(input).version));
          ')
          TS=$(date -u +%s)
          NEW_VER=$(node scripts/resolve-dev-package-version.mjs "$VER" "$MAIN_VER" "$TS")
          echo "version=$NEW_VER" >> "$GITHUB_OUTPUT"
          export NEW_VER
          node -e '
            const fs = require("fs");
            const files = ["./package.json", "./apps/web/package.json"];
            for (const f of files) {
              if (!fs.existsSync(f)) continue;
              const j = JSON.parse(fs.readFileSync(f, "utf8"));
              j.version = process.env.NEW_VER;
              fs.writeFileSync(f, JSON.stringify(j, null, 2) + "\n");
            }
          '
          echo "Set version to $NEW_VER (stable baseline: $MAIN_VER)"

      - name: Changelog (dev, best-effort)
        continue-on-error: true
        env:
          NEW_VER: ${{ steps.version.outputs.version }}
          RN_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -uo pipefail
          RN_SCRIPT="scripts/release-notes.mjs"
          if [ ! -f "$RN_SCRIPT" ]; then
            echo "[changelog] scripts/release-notes.mjs is missing; skipping."
            exit 0
          fi
          LAST_BUMP=$(git log --first-parent --format='%H%x09%s' -n 400 \
            | awk -F'\t' '!f && ($2 ~ /^set version to / || $2 ~ /^chore: set version to /) {print $1; f=1}')
          if [ -n "$LAST_BUMP" ]; then
            COMMITS=$(git log --reverse --first-parent --format=%H "${LAST_BUMP}..HEAD")
          else
            # Repository without an earlier bump: inspect recent first-parent merges.
            COMMITS=$(git log --reverse --first-parent --format=%H -n 80)
          fi
          QUEUE=""
          for sha in $COMMITS; do
            FILES=$(git diff-tree -m --first-parent --no-commit-id --diff-filter=A --name-only -r "$sha" -- changelog/unreleased)
            [ -z "$FILES" ] && continue
            SUBJ=$(git log -1 --format=%s "$sha")
            PR_NUM=""
            if [[ "$SUBJ" =~ \(#([0-9]+)\)[[:space:]]*$ ]]; then
              PR_NUM="${BASH_REMATCH[1]}"
            elif [[ "$SUBJ" =~ ^Merge\ pull\ request\ \#([0-9]+) ]]; then
              PR_NUM="${BASH_REMATCH[1]}"
            fi
            AUTHOR=$(git log -1 --format=%an "$sha")
            CDATE=$(git log -1 --format=%cI "$sha")
            for f in $FILES; do
              case "$f" in *.md) ;; *) continue ;; esac
              [ -f "$f" ] || continue
              QUEUE=$(printf '%s\n' "$QUEUE" | awk -v p="$f|" 'index($0, p) != 1')
              QUEUE="${QUEUE}
          $f|$PR_NUM|$CDATE|$AUTHOR"
            done
          done
          # Catch files left in the working tree when a squash range omitted them.
          for f in changelog/unreleased/*.md; do
            [ -f "$f" ] || continue
            case "$f" in *.md) ;; *) continue ;; esac
            if printf '%s\n' "$QUEUE" | awk -v p="$f|" 'index($0, p) == 1 {found=1} END{exit !found}'; then
              continue
            fi
            QUEUE="${QUEUE}
          $f|||github-actions[bot]"
          done
          COUNT=0
          CONSUMED=""
          while IFS='|' read -r f PR_NUM CDATE AUTHOR; do
            f=$(printf '%s' "$f" | sed 's/^[[:space:]]*//')
            [ -z "$f" ] && continue
            if RN_SOURCE="$f" RN_VERSION="$NEW_VER" RN_PR="$PR_NUM" RN_AUTHOR="$AUTHOR" \
               RN_DATE="${CDATE:-$(date -u +%Y-%m-%dT%H:%M:%SZ)}" node "$RN_SCRIPT" add-dev; then
              COUNT=$((COUNT + 1))
              CONSUMED="$CONSUMED $f"
            fi
          done < <(printf '%s\n' "$QUEUE")
          if [ -n "$CONSUMED" ]; then
            git rm -q --ignore-unmatch $CONSUMED 2>/dev/null || true
          fi
          echo "[changelog] consumed $COUNT entries since ${LAST_BUMP:-the beginning}"
      - name: Commit on branch, open PR, auto-merge
        env:
          NEW_VER: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json apps/web/package.json
          git add releases.json CHANGELOG.md 2>/dev/null || true
          git add -A changelog 2>/dev/null || true
          git checkout -- . 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No version change, skip commit"
            exit 0
          fi

          # PRs created with GITHUB_TOKEN register pull_request workflows as
          # action_required. Replace stale bumps with a snapshot of current dev.
          OPEN_URLS=$(gh pr list --base "$TARGET_BRANCH" --state open --json title,url --jq \
            '.[] | select((.title | startswith("set version to ")) or (.title | startswith("chore: set version to "))) | .url')
          while IFS= read -r OPEN_URL; do
            [ -z "$OPEN_URL" ] && continue
            echo "Closing stale version bump: $OPEN_URL"
            gh pr close "$OPEN_URL" --delete-branch || gh pr close "$OPEN_URL"
          done <<< "$OPEN_URLS"

          BRANCH="chore/version-dev-${NEW_VER//./-}"
          # Keep the subject free of prefixes. Squash reuses it verbatim so the
          # dev commit does not gain a PR number or bot trailer.
          SUBJECT="set version to $NEW_VER"
          git commit -m "$SUBJECT"
          git checkout -B "$BRANCH"
          git push -u origin "$BRANCH" --force

          PR_URL=$(gh pr create --base "$TARGET_BRANCH" --head "$BRANCH" \
            --title "$SUBJECT" \
            --body "Automatic dev version bump (\`$NEW_VER\`) and consumption of changelog/unreleased entries.")
          echo "PR: $PR_URL"

          # GITHUB_TOKEN-created PRs register pull_request workflows but GitHub
          # leaves them action_required. Rerunning the three registered runs
          # attaches checks to the PR without an external PAT.
          HEAD_SHA=$(git rev-parse HEAD)
          for attempt in $(seq 1 12); do
            RUNS=$(gh run list --branch "$BRANCH" --event pull_request --limit 20 \
              --json databaseId,workflowName,headSha,status,conclusion)
            CI_RUN=$(printf '%s' "$RUNS" | jq -r --arg sha "$HEAD_SHA" \
              '[.[] | select(.headSha == $sha and .workflowName == "CI")][0].databaseId // empty')
            SECURITY_RUN=$(printf '%s' "$RUNS" | jq -r --arg sha "$HEAD_SHA" \
              '[.[] | select(.headSha == $sha and .workflowName == "Security")][0].databaseId // empty')
            CHANGELOG_RUN=$(printf '%s' "$RUNS" | jq -r --arg sha "$HEAD_SHA" \
              '[.[] | select(.headSha == $sha and .workflowName == "PR Changelog Guard")][0].databaseId // empty')
            if [ -n "$CI_RUN" ] && [ -n "$SECURITY_RUN" ] && [ -n "$CHANGELOG_RUN" ]; then
              break
            fi
            if [ "$attempt" = "12" ]; then
              echo "The three pull_request workflows were not registered. Leaving the PR open."
              exit 1
            fi
            sleep 5
          done

          for RUN_ID in "$CI_RUN" "$SECURITY_RUN" "$CHANGELOG_RUN"; do
            CONCLUSION=$(gh run view "$RUN_ID" --json conclusion --jq .conclusion)
            if [ "$CONCLUSION" = "action_required" ]; then
              echo "Rerunning workflow that was waiting for approval: $RUN_ID"
              gh run rerun "$RUN_ID"
            fi
          done

          # Require SUCCESS from each identified workflow so duplicate checks
          # cannot hide a missing workflow.
          for attempt in $(seq 1 70); do
            RUN_FAILURE=0
            RUN_PENDING=0
            for RUN_ID in "$CI_RUN" "$SECURITY_RUN" "$CHANGELOG_RUN"; do
              RUN_STATE=$(gh run view "$RUN_ID" --json status,conclusion \
                --jq '[.status, .conclusion] | @tsv')
              RUN_STATUS=${RUN_STATE%%$'\t'*}
              RUN_CONCLUSION=${RUN_STATE#*$'\t'}
              if [ "$RUN_STATUS" != "completed" ]; then
                RUN_PENDING=$((RUN_PENDING + 1))
              elif [ "$RUN_CONCLUSION" != "success" ]; then
                RUN_FAILURE=$((RUN_FAILURE + 1))
              fi
            done
            [ "$RUN_FAILURE" = "0" ] || {
              echo "A pull-request workflow failed. Leaving the PR open."
              exit 1
            }
            [ "$RUN_PENDING" = "0" ] && break
            if [ "$attempt" = "70" ]; then
              echo "Timed out waiting for pull-request workflows."
              exit 1
            fi
            sleep 30
          done

          # Validate the nine protected contexts by exact name and SUCCESS.
          # An empty rollup is never success.
          for attempt in $(seq 1 70); do
            PR_HEAD=$(gh pr view "$PR_URL" --json headRefOid --jq .headRefOid)
            REQUIRED=$(gh pr view "$PR_URL" --json statusCheckRollup --jq \
              '[.statusCheckRollup[] | select(.name == "docker-compose validate" or .name == "Lint TS (apps/web)" or .name == "Typecheck TS (apps/web)" or .name == "Test TS (apps/web)" or .name == "Lint Python (apps/worker)" or .name == "Test Python (apps/worker)" or .name == "Docker build (apps + Easypanel)" or .name == "Quality Gate" or .name == "Prisma migration gate")] | unique_by(.name)')
            REQUIRED_TOTAL=$(printf '%s' "$REQUIRED" | jq 'length')
            REQUIRED_NOT_SUCCESS=$(printf '%s' "$REQUIRED" | jq \
              '[.[] | select(.status != "COMPLETED" or .conclusion != "SUCCESS")] | length')
            if [ "$PR_HEAD" != "$HEAD_SHA" ]; then
              echo "PR head differs from the expected snapshot ($PR_HEAD != $HEAD_SHA)."
              exit 1
            fi
            if [ "${REQUIRED_TOTAL:-0}" = "9" ] && [ "${REQUIRED_NOT_SUCCESS:-1}" = "0" ]; then
              echo "Nine exact required checks passed on head $HEAD_SHA."
              break
            fi
            if [ "$attempt" = "70" ]; then
              echo "Timed out waiting for required checks. Leaving the PR open."
              exit 1
            fi
            sleep 30
          done

          for attempt in $(seq 1 20); do
            STATE=$(gh pr view "$PR_URL" --json mergeStateStatus --jq .mergeStateStatus)
            if [ "$STATE" = "CLEAN" ]; then
              # Explicit subject and body prevent PR numbers and trailers.
              gh pr merge --squash --delete-branch \
                --subject "$SUBJECT" \
                --body "" \
                "$PR_URL"
              break
            fi
            if [ "$attempt" = "20" ]; then
              echo "PR did not become CLEAN after checks (state: $STATE)."
              exit 1
            fi
            sleep 15
          done

          {
            echo "## Dev version"
            echo ""
            echo "- Version: \`$NEW_VER\`"
            echo "- PR: $PR_URL"
          } >> "$GITHUB_STEP_SUMMARY"
