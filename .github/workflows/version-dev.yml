# ============================================================================
# version-dev — metadata de build para dev, sem mutar package.json
# ============================================================================
# Regra: `dev` não ganha commit/tag automático de pre-release. A versão estável
# vive em package.json e tags vX.Y.Z; builds de dev usam metadata efêmera
# `X.Y.Z-dev.<run>+<sha>` ou o build arg VOXEN_VERSION do deploy.
# ============================================================================

name: Dev version metadata

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version-dev:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Compute dev metadata
        id: version
        run: |
          set -euo pipefail
          LAST_STABLE=$(git tag --list 'v[0-9]*' --sort=-v:refname | grep -Ev -- '-(dev|alpha|beta|rc)\.' | head -n1 || true)
          if [[ -n "$LAST_STABLE" ]]; then
            BASE_VER="${LAST_STABLE#v}"
          else
            BASE_VER=$(node -p "require('./package.json').version.split('-')[0]")
          fi
          SHORT_SHA="${GITHUB_SHA::7}"
          DEV_VER="${BASE_VER}-dev.${GITHUB_RUN_NUMBER}+${SHORT_SHA}"
          echo "base_version=$BASE_VER" >> "$GITHUB_OUTPUT"
          echo "dev_version=$DEV_VER" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          {
            echo "## Dev version"
            echo ""
            echo "- Base estável: \`$BASE_VER\`"
            echo "- Metadata dev: \`$DEV_VER\`"
            echo "- Commit: \`$SHORT_SHA\`"
            echo ""
            echo "Nenhum arquivo, commit ou tag foi criado por este workflow."
          } >> "$GITHUB_STEP_SUMMARY"
