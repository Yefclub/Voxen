name: Proxy Agent Image

on:
  workflow_dispatch:
  push:
    branches: [dev, main]
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
    paths:
      - 'apps/proxy-agent/**'
      - '.github/workflows/proxy-agent-image.yml'

permissions:
  contents: read
  packages: write

concurrency:
  group: proxy-agent-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/yefclub/voxen-proxy-agent

jobs:
  build-and-push:
    name: Build & push proxy-agent image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute tags
        id: meta
        run: |
          set -eu
          short_sha="${GITHUB_SHA::7}"
          tags_file="$(mktemp)"
          printf '%s\n' "${IMAGE_NAME}:sha-${short_sha}" > "$tags_file"

          case "$GITHUB_REF" in
            refs/heads/dev | refs/heads/main)
              printf '%s\n' "${IMAGE_NAME}:latest" >> "$tags_file"
              ;;
            refs/tags/v*)
              version="${GITHUB_REF_NAME#v}"
              printf '%s\n' "${IMAGE_NAME}:${GITHUB_REF_NAME}" >> "$tags_file"
              printf '%s\n' "${IMAGE_NAME}:${version}" >> "$tags_file"
              ;;
          esac

          {
            echo "tags<<EOF"
            cat "$tags_file"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: apps/proxy-agent
          file: apps/proxy-agent/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
