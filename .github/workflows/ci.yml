name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Secret de teste — NUNCA usar em prod. Em prod vem do .env na raiz.
  BETTER_AUTH_SECRET: ci-secret-not-for-production-use-at-least-32-bytes-yes-this-is-long-enough

jobs:
  lint-ts:
    name: Lint TS (apps/web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.x
      - uses: pnpm/action-setup@v6
      - run: pnpm install --frozen-lockfile
      - name: Prisma generate
        run: pnpm exec prisma generate --schema=../../prisma/schema.prisma
        working-directory: apps/web
      - name: Lint
        run: bun run lint
        working-directory: apps/web
      - name: Format check
        run: bun run format:check
        working-directory: apps/web

  typecheck-ts:
    name: Typecheck TS (apps/web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.x
      - uses: pnpm/action-setup@v6
      - run: pnpm install --frozen-lockfile
      - name: Prisma generate
        run: pnpm exec prisma generate --schema=../../prisma/schema.prisma
        working-directory: apps/web
      - name: Typecheck
        run: bun run typecheck
        working-directory: apps/web

  test-ts:
    name: Test TS (apps/web)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: voxen_test
          POSTGRES_USER: voxen
          POSTGRES_PASSWORD: dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U voxen"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://voxen:dev@localhost:5432/voxen_test
      REDIS_URL: redis://localhost:6379
      MASTER_KEY: dm94ZW5fY2lfbWFzdGVyX2tleV8zMl9ieXRlcyEhISE=
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.x
      - uses: pnpm/action-setup@v6
      - run: pnpm install --frozen-lockfile
      # Testes da extensão MV3 (apps/extension/tests) — não dependem de DB nem
      # de Prisma, então rodam antes e falham rápido.
      - name: Test extension
        run: bun run test:extension
        working-directory: apps/web
      - name: Prisma generate
        run: pnpm exec prisma generate --schema=../../prisma/schema.prisma
        working-directory: apps/web
      - name: Prisma migrate deploy
        run: pnpm exec prisma migrate deploy --schema=../../prisma/schema.prisma
        working-directory: apps/web
      - name: Test
        run: bun test
        working-directory: apps/web

  lint-py-worker:
    name: Lint Python (apps/worker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v8.1.0
      - run: uv sync --frozen
        working-directory: apps/worker
      - run: uv run ruff check .
        working-directory: apps/worker
      - run: uv run ruff format --check .
        working-directory: apps/worker
      - run: uv run mypy src
        working-directory: apps/worker

  test-py-worker:
    name: Test Python (apps/worker)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: voxen_worker_test
          POSTGRES_USER: voxen
          POSTGRES_PASSWORD: dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U voxen"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://voxen:dev@localhost:5432/voxen_worker_test
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.x
      - uses: pnpm/action-setup@v6
      - run: pnpm install --frozen-lockfile
      - name: Prisma migrate deploy
        run: pnpm exec prisma migrate deploy --schema=../../prisma/schema.prisma
        working-directory: apps/web
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v8.1.0
      - run: uv sync --frozen
        working-directory: apps/worker
      - run: uv run pytest
        working-directory: apps/worker

  # ==========================================================================
  # As três imagens são construídas em PARALELO. Antes eram três passos
  # sequenciais num job só, e o job custava o tempo somado: web 3m57s +
  # worker 3m01s + Easypanel 2m47s = 10m40s, o caminho crítico do CI inteiro
  # (o segundo job mais lento leva 2m10s). Como `version-dev` abre PR e espera
  # estes mesmos checks para mergear o bump, todo commit de versão pagava os
  # dez minutos.
  #
  # `scope` distinto por imagem é obrigatório, não cosmético: o cache
  # `type=gha` usa um escopo único por padrão, então três builds concorrentes
  # com `mode=max` sobrescreveriam o cache um do outro a cada run.
  # ==========================================================================
  docker-build-web:
    name: Docker build (web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - name: Build web
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  docker-build-worker:
    name: Docker build (worker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - name: Build worker
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/worker/Dockerfile
          push: false
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker

  docker-build-easypanel:
    name: Docker build (Easypanel App)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - name: Build Easypanel App image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: voxen-easypanel:ci
          cache-from: type=gha,scope=easypanel
          cache-to: type=gha,mode=max,scope=easypanel
      - name: Smoke test Easypanel App image
        run: |
          set -eux
          docker network create voxen-smoke

          docker run -d --name smoke-postgres --network voxen-smoke --network-alias postgres \
            -e POSTGRES_DB=voxen \
            -e POSTGRES_USER=voxen \
            -e POSTGRES_PASSWORD=dev \
            postgres:17-alpine

          docker run -d --name smoke-redis --network voxen-smoke --network-alias redis \
            redis:7-alpine redis-server --requirepass dev

          docker run -d --name smoke-minio --network voxen-smoke --network-alias minio \
            -e MINIO_ROOT_USER=voxen \
            -e MINIO_ROOT_PASSWORD=voxen_dev_minio_password \
            minio/minio:latest server /data

          for i in $(seq 1 30); do
            docker exec smoke-postgres pg_isready -U voxen -d voxen && break
            test "$i" != 30
            sleep 2
          done

          for i in $(seq 1 30); do
            docker exec smoke-redis redis-cli -a dev ping | grep -q PONG && break
            test "$i" != 30
            sleep 2
          done

          for i in $(seq 1 30); do
            docker run --rm --network voxen-smoke curlimages/curl:latest \
              -fsS http://minio:9000/minio/health/ready && break
            test "$i" != 30
            sleep 2
          done

          docker run --rm --network voxen-smoke --entrypoint sh minio/mc:latest -c \
            'mc alias set voxen http://minio:9000 voxen voxen_dev_minio_password && mc mb --ignore-existing voxen/voxen-transcripts'

          docker run -d --name voxen-easypanel --network voxen-smoke -p 3000:3000 \
            -e APP_BASE_URL=http://localhost:3000 \
            -e DATABASE_URL=postgresql://voxen:dev@postgres:5432/voxen \
            -e REDIS_URL=redis://:dev@redis:6379/0 \
            -e BETTER_AUTH_SECRET=ci-secret-not-for-production-use-at-least-32-bytes-yes-this-is-long-enough \
            -e MASTER_KEY=dm94ZW5fY2lfbWFzdGVyX2tleV8zMl9ieXRlcyEhISE= \
            -e S3_ENDPOINT=http://minio:9000 \
            -e S3_ACCESS_KEY=voxen \
            -e S3_SECRET_KEY=voxen_dev_minio_password \
            -e S3_BUCKET=voxen-transcripts \
            -e S3_REGION=us-east-1 \
            -e S3_FORCE_PATH_STYLE=true \
            voxen-easypanel:ci

          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3000/health/deep; then
              exit 0
            fi
            docker logs --tail=80 voxen-easypanel
            sleep 3
          done

          docker logs voxen-easypanel
          exit 1

  # ==========================================================================
  # Agregador. Existe por causa do NOME: `Docker build (apps + Easypanel)` é
  # um required status check da proteção de `dev`/`main` E está escrito por
  # extenso no laço de espera do `version-dev.yml`. Dividir os builds sem
  # manter este nome faria toda PR travar esperando um contexto que nunca mais
  # reportaria.
  #
  # `if: always()` + asserção explícita dos resultados é o que torna isto
  # seguro. Sem `always()`, uma build que falha deixa este job como `skipped`,
  # e a proteção de branch trata `skipped` como aprovado — daria verde falso
  # exatamente no caso em que o build quebrou.
  # ==========================================================================
  docker-build:
    name: Docker build (apps + Easypanel)
    runs-on: ubuntu-latest
    if: always()
    needs: [docker-build-web, docker-build-worker, docker-build-easypanel]
    steps:
      - name: Assert image builds succeeded
        env:
          WEB: ${{ needs.docker-build-web.result }}
          WORKER: ${{ needs.docker-build-worker.result }}
          EASYPANEL: ${{ needs.docker-build-easypanel.result }}
        run: |
          set -eu
          echo "web=$WEB worker=$WORKER easypanel=$EASYPANEL"
          failed=0
          for pair in "web:$WEB" "worker:$WORKER" "easypanel:$EASYPANEL"; do
            if [ "${pair#*:}" != "success" ]; then
              echo "::error::Build da imagem ${pair%%:*} não passou (${pair#*:})."
              failed=1
            fi
          done
          exit "$failed"

  compose-validate:
    name: docker-compose validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate compose
        run: docker compose -f docker-compose.yml config -q
