name: Release

on:
  push:
    # Only stable vX.Y.Z tags publish a release.
    # Development builds use ephemeral metadata and do not create tags.
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            LOG=$(git log "$PREV_TAG..HEAD" --pretty=format:'- %s (%h)')
          else
            LOG=$(git log --pretty=format:'- %s (%h)')
          fi
          {
            echo "log<<EOF"
            echo "$LOG"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          body: |
            ## Changes

            ${{ steps.changelog.outputs.log }}

            ## Images

            - `ghcr.io/${{ github.repository_owner }}/voxen:${{ github.ref_name }}`
