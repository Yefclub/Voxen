name: Release

on:
  push:
    # Só tags estáveis vX.Y.Z disparam release.
    # Builds de dev usam metadata efêmera e não criam tags/release.
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-and-push:
    name: Build & push images
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [web, worker]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/voxen-${{ matrix.app }}
          tags: |
            type=raw,value=${{ github.ref_name }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest
      - name: Build args (versão/sha/timestamp) injetados na image
        id: bargs
        run: |
          REF=${GITHUB_REF#refs/tags/v}
          {
            echo "version=$REF"
            echo "sha=${GITHUB_SHA:0:7}"
            echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VOXEN_VERSION=${{ steps.bargs.outputs.version }}
            VOXEN_GIT_SHA=${{ steps.bargs.outputs.sha }}
            VOXEN_BUILT_AT=${{ steps.bargs.outputs.built_at }}

  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            LOG=$(git log "$PREV_TAG..HEAD" --pretty=format:'- %s (%h)')
          else
            LOG=$(git log --pretty=format:'- %s (%h)')
          fi
          {
            echo "log<<EOF"
            echo "$LOG"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          body: |
            ## Mudanças

            ${{ steps.changelog.outputs.log }}

            ## Imagens

            - `ghcr.io/${{ github.repository_owner }}/voxen-web:${{ github.ref_name }}`
            - `ghcr.io/${{ github.repository_owner }}/voxen-worker:${{ github.ref_name }}`
