name: Security

on:
  workflow_dispatch:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  schedule:
    - cron: '0 3 * * 1'   # toda segunda 03:00 UTC

# ============================================================================
# IMPORTANTE: workflows que fariam upload-sarif (CodeQL, SARIF nos scanners)
# requerem GitHub Advanced Security, PAGO p/ repos privados.
# Por ora, scanners rodam em modo "fail-on-finding" e printam output legível
# nos logs do CI. Quando GHAS for adquirido:
#   - reativar `format: sarif` + `upload-sarif`
#   - adicionar job codeql-ts
#   - reativar dependency-review (também GHAS)
# ============================================================================

permissions:
  contents: read
  pull-requests: read

jobs:
  trivy-fs:
    name: Trivy filesystem scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
          format: table

  trivy-image:
    name: Trivy image scan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [web, chat, worker]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: false
          load: true
          tags: voxen-${{ matrix.app }}:scan
          cache-from: type=gha
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: voxen-${{ matrix.app }}:scan
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
          format: table
          # Apenas vuln scan em imagens; secret-scan rola só no fs scan
          # (evita falsos positivos em chaves dummy nos extractors do yt-dlp etc.)
          scanners: vuln,misconfig

  bandit:
    name: Bandit (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: '3.13'
      - name: Install bandit
        run: uv tool install bandit
      - name: Scan
        run: bandit -r apps/chat/src apps/worker/src -ll

  pip-audit:
    name: pip-audit
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [chat, worker]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: '3.13'
      - run: uv sync --frozen
        working-directory: apps/${{ matrix.app }}
      - run: uv tool install pip-audit
      - run: pip-audit --requirement apps/${{ matrix.app }}/uv.lock --strict
        continue-on-error: true  # remove once green

  bun-audit:
    name: bun audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.x
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod
        continue-on-error: true
    continue-on-error: true

  gitleaks:
    name: Gitleaks (secret scanning)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Roda gitleaks CLI direto (free) ao invés da action v2 (licença paga p/ orgs)
      - name: Install gitleaks
        run: |
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/
      - name: Scan
        run: gitleaks detect --source=. --config=.gitleaks.toml --redact --verbose --exit-code=1
