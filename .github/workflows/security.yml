name: Security

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  schedule:
    - cron: '0 3 * * 1'   # toda segunda 03:00 UTC

permissions:
  contents: read
  security-events: write
  pull-requests: read
  actions: read

jobs:
  trivy-fs:
    name: Trivy filesystem scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: sarif
          output: trivy-fs.sarif
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

  trivy-image:
    name: Trivy image scan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [web, chat, worker]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: false
          load: true
          tags: voxen-${{ matrix.app }}:scan
          cache-from: type=gha
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: voxen-${{ matrix.app }}:scan
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: sarif
          output: trivy-${{ matrix.app }}.sarif
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-${{ matrix.app }}.sarif
          category: trivy-${{ matrix.app }}

  codeql-ts:
    name: CodeQL (TS/JS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v3
        with:
          category: codeql-ts

  bandit:
    name: Bandit (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: '3.13'
      - name: Install bandit
        run: uv tool install bandit
      - name: Scan + garante sarif existe
        run: |
          # Bandit retorna exit code não-zero em findings; queremos o sarif gerado
          # mesmo com findings (upload-sarif lida).
          set +e
          bandit -r apps/chat/src apps/worker/src -ll -f sarif -o bandit.sarif
          RC=$?
          # Se sarif não foi criado (zero findings, erro de path), cria um vazio
          if [ ! -f bandit.sarif ]; then
            echo '{"version":"2.1.0","$schema":"https://json.schemastore.org/sarif-2.1.0.json","runs":[]}' > bandit.sarif
          fi
          echo "Bandit exit code: $RC"
          exit 0
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: bandit.sarif
          category: bandit

  pip-audit:
    name: pip-audit
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [chat, worker]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: '3.13'
      - run: uv sync --frozen
        working-directory: apps/${{ matrix.app }}
      - run: uv tool install pip-audit
      - run: pip-audit --requirement apps/${{ matrix.app }}/uv.lock --strict
        continue-on-error: true  # remove once green

  bun-audit:
    name: bun audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.x
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod
        continue-on-error: true
    continue-on-error: true

  gitleaks:
    name: Gitleaks (secret scanning)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Roda gitleaks CLI direto (free) ao invés da action v2 (licença paga p/ orgs)
      - name: Install gitleaks
        run: |
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/
      - name: Scan
        run: gitleaks detect --source=. --config=.gitleaks.toml --redact --verbose --exit-code=1

  # Dependency review action requer GitHub Advanced Security (paid p/ repos privados).
  # Confiamos em Dependabot alerts (já habilitado) + dependabot.yml + pip-audit + bun audit.
