# ============================================================================
# pr-release-labels — validates SemVer in pull requests to main
# ============================================================================
# Pull requests to main must be release PRs with one release:* label and the
# expected package version. This keeps main protected without workflow commits.
# ============================================================================

name: PR release labels

on:
  pull_request:
    branches: [main]
    types: [opened, edited, labeled, unlabeled, synchronize]

permissions:
  pull-requests: read

jobs:
  check-label:
    name: Release label gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Validate release label, version bump, and title
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail

          count=0
          bump=""
          for candidate in patch minor major; do
            if echo ",$LABELS," | grep -q ",release:${candidate},"; then
              count=$((count + 1))
              bump="$candidate"
            fi
          done

          if [ "$count" -ne 1 ]; then
            echo "A PR to main requires exactly one label: release:patch, release:minor, or release:major."
            exit 1
          fi

          last_stable=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | grep -Em1 '^v[0-9]+\.[0-9]+\.[0-9]+$' || true)
          if [ -n "$last_stable" ]; then
            base_version="${last_stable#v}"
          else
            base_version="$(node -p "require('./package.json').version.split('-')[0]")"
          fi

          expected="$(BASE_VER="$base_version" BUMP="$bump" node -e "
            const v = process.env.BASE_VER.split('.').map(Number);
            if (v.length !== 3 || v.some(Number.isNaN)) throw new Error('Invalid base version: ' + process.env.BASE_VER);
            if (process.env.BUMP === 'major') { v[0] += 1; v[1] = 0; v[2] = 0; }
            else if (process.env.BUMP === 'minor') { v[1] += 1; v[2] = 0; }
            else { v[2] += 1; }
            console.log(v.join('.'));
          ")"

          root_version="$(node -p "require('./package.json').version")"
          web_version="$(node -p "require('./apps/web/package.json').version")"

          if ! echo "$root_version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "package.json must contain stable SemVer X.Y.Z; current: $root_version"
            exit 1
          fi
          if [ "$root_version" != "$web_version" ]; then
            echo "Version mismatch: package.json=$root_version apps/web/package.json=$web_version"
            exit 1
          fi
          if [ "$root_version" != "$expected" ]; then
            echo "Expected release:$bump version from $base_version: $expected; current: $root_version"
            echo "Run: pnpm release:prepare $bump"
            exit 1
          fi
          if [ "$PR_TITLE" != "v$root_version" ]; then
            echo "Release PR title must be exactly v$root_version; current: $PR_TITLE"
            exit 1
          fi

          {
            echo "## Release gate"
            echo ""
            echo "- Bump: \`$bump\`"
            echo "- Previous stable version: \`$base_version\`"
            echo "- Next release: \`$expected\`"
            echo "- Required title: \`v$root_version\`"
          } >> "$GITHUB_STEP_SUMMARY"
