# ============================================================================
# pr-release-labels — exige release:patch|minor|major em PRs pra main
# ============================================================================
# Inspirado em Grupo-Potencial-IA-e-Inovacao/workflows/pr-release-labels.yml.
#
# PRs de dev→main DEVEM ter uma das labels release:* — o workflow
# `version-main.yml` lê essa label pra decidir o bump semver. Sem label,
# falha o check (não bloqueia merge se PR é dispensável de release, mas
# faz o owner pensar antes).
# ============================================================================

name: PR release labels

on:
  pull_request:
    branches: [main]
    types: [opened, edited, labeled, unlabeled, synchronize]

permissions:
  pull-requests: read

jobs:
  check-label:
    runs-on: ubuntu-latest
    steps:
      - name: Exige uma label release:*
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          set -euo pipefail
          if echo ",$LABELS," | grep -q ",release:patch,\|,release:minor,\|,release:major,"; then
            echo "✅ PR tem label release:* — bump será aplicado no merge."
            exit 0
          fi
          echo "❌ PR pra main precisa de uma das labels: release:patch, release:minor, release:major"
          echo "   Adicione a label apropriada antes de mergear."
          exit 1
