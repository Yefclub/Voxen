name: Easypanel Image

# Deploy/imagem NÃO roda em todo push de dev — só manual ou release tag.
on:
  workflow_dispatch:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read
  packages: write

concurrency:
  group: easypanel-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/yefclub/voxen

jobs:
  build-and-push:
    name: Build & push Easypanel image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute tags
        id: meta
        run: |
          set -eu
          short_sha="${GITHUB_SHA::7}"
          tags_file="$(mktemp)"
          printf '%s\n' "${IMAGE_NAME}:sha-${short_sha}" > "$tags_file"

          case "$GITHUB_REF" in
            refs/heads/dev)
              package_version="$(node -p "require('./package.json').version")"
              last_stable=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | grep -Em1 '^v[0-9]+\.[0-9]+\.[0-9]+$' || true)
              if [ -n "$last_stable" ]; then
                base_version="${last_stable#v}"
              else
                base_version="${package_version%%-*}"
              fi
              stamp="$(date -u +%s)"
              version="$(node scripts/resolve-dev-image-version.mjs version "$package_version" "$base_version" "$stamp")"
              docker_version="$(node scripts/resolve-dev-image-version.mjs docker-tag "$package_version" "$base_version" "$stamp")"
              printf '%s\n' "${IMAGE_NAME}:dev" >> "$tags_file"
              printf '%s\n' "${IMAGE_NAME}:dev-${docker_version}" >> "$tags_file"
              printf '%s\n' "${IMAGE_NAME}:${docker_version}" >> "$tags_file"
              ;;
            refs/heads/main)
              version="$(node -p "require('./package.json').version")"
              printf '%s\n' "${IMAGE_NAME}:latest" >> "$tags_file"
              ;;
            refs/tags/v*)
              version="${GITHUB_REF_NAME#v}"
              printf '%s\n' "${IMAGE_NAME}:${GITHUB_REF_NAME}" >> "$tags_file"
              printf '%s\n' "${IMAGE_NAME}:${version}" >> "$tags_file"
              ;;
            *)
              version="manual-${short_sha}"
              ;;
          esac

          {
            echo "tags<<EOF"
            cat "$tags_file"
            echo "EOF"
            echo "version=${version}"
            echo "sha=${short_sha}"
            echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          # Mesmo escopo que o `ci.yml` usa para esta imagem. Antes os dois
          # liam o escopo padrão (`buildkit`); com o CI passando a gravar em
          # `easypanel`, ficar no padrão deixaria este build de release subir
          # sempre frio.
          cache-from: type=gha,scope=easypanel
          cache-to: type=gha,mode=max,scope=easypanel
          build-args: |
            VOXEN_VERSION=${{ steps.meta.outputs.version }}
            VOXEN_GIT_SHA=${{ steps.meta.outputs.sha }}
            VOXEN_BUILT_AT=${{ steps.meta.outputs.built_at }}
