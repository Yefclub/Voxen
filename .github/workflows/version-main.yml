# ============================================================================
# version-main — cria tag estável vX.Y.Z em cada merge dev→main
# ============================================================================
# Estratégia OSS-friendly (sem PAT, sem bypass):
#  - Roda em push pra `main` (após merge da PR de release dev→main).
#  - Detecta o número da PR pelo squash commit "Title (#N)".
#  - Lê labels da PR: release:major | release:minor | release:patch (default).
#  - Lê última tag estável + bumpa o componente correspondente.
#  - Cria SÓ TAG. NÃO modifica `package.json` nem faz commit em main.
#    Tag não esbarra em branch protection. Funciona com `GITHUB_TOKEN`.
#  - Tag estável dispara `release.yml` que builda e pusha imagens pro ghcr.
# ============================================================================

name: Version main on merge

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: read

jobs:
  version-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Detect bump type from PR labels
        id: bump
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          PR_NUM=""
          # Parameter expansion (sem pipe → sem SIGPIPE em msgs gigantes).
          FIRST_LINE="${COMMIT_MSG%%$'\n'*}"
          if [[ "$FIRST_LINE" =~ \(#([0-9]+)\)[[:space:]]*$ ]]; then
            PR_NUM="${BASH_REMATCH[1]}"
          fi
          if [[ -z "$PR_NUM" ]]; then
            PR_NUM=$(gh pr list --base main --state merged --limit 1 \
              --json number --jq '.[0].number' 2>/dev/null || echo "")
          fi
          BUMP="patch"
          if [[ -n "$PR_NUM" ]]; then
            LABELS=$(gh pr view "$PR_NUM" --json labels --jq '.labels[].name' 2>/dev/null || true)
            if echo "$LABELS" | grep -q "release:major"; then BUMP="major"
            elif echo "$LABELS" | grep -q "release:minor"; then BUMP="minor"
            fi
          fi
          echo "bump=$BUMP" >> "$GITHUB_OUTPUT"
          echo "Detected bump: $BUMP (PR #$PR_NUM)"

      - name: Compute new stable tag
        id: version
        run: |
          set -euo pipefail
          # Última tag estável (sem -dev.N). Se nenhuma, fallback ao pkg.json.
          LAST_STABLE=$(git tag --list 'v*' --sort=-v:refname | grep -v -- '-dev\.' | head -n1 || true)
          if [[ -z "$LAST_STABLE" ]]; then
            BASE_VER=$(node -p "require('./package.json').version")
          else
            BASE_VER="${LAST_STABLE#v}"
          fi
          BUMP="${{ steps.bump.outputs.bump }}"
          NEW_VER=$(BASE_VER="$BASE_VER" BUMP="$BUMP" node -e "
            const v = process.env.BASE_VER.split('.').map(Number);
            if (process.env.BUMP === 'major') { v[0]++; v[1]=0; v[2]=0; }
            else if (process.env.BUMP === 'minor') { v[1]++; v[2]=0; }
            else { v[2]++; }
            console.log(v.join('.'));
          ")
          echo "new_tag=v$NEW_VER" >> "$GITHUB_OUTPUT"
          echo "Bumping main to v$NEW_VER (last stable: $LAST_STABLE)"

      - name: Create + push tag
        env:
          NEW_TAG: ${{ steps.version.outputs.new_tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse "$NEW_TAG" >/dev/null 2>&1; then
            echo "Tag $NEW_TAG já existe, pulando."
            exit 0
          fi
          git tag -a "$NEW_TAG" -m "Release $NEW_TAG"
          git push origin "$NEW_TAG"
          echo "Released $NEW_TAG — release.yml será disparado pela tag."
