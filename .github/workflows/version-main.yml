# ============================================================================
# version-main — publica tag estável vX.Y.Z a partir de main
# ============================================================================
# Branch-protection friendly:
#  - a PR de release já deve trazer package.json em X.Y.Z estável;
#  - este workflow não commita em main nem em dev;
#  - se a tag vX.Y.Z ainda não existir, cria a tag e despacha release.yml.
# ============================================================================

name: Publish stable release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read
  actions: write

concurrency:
  group: version-main-${{ github.repository }}-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  version-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Read stable version
        id: version
        run: |
          set -euo pipefail
          ROOT_VER=$(node -p "require('./package.json').version")
          WEB_VER=$(node -p "require('./apps/web/package.json').version")
          if ! echo "$ROOT_VER" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "package.json precisa estar em SemVer estável X.Y.Z; atual: $ROOT_VER"
            exit 1
          fi
          if [ "$ROOT_VER" != "$WEB_VER" ]; then
            echo "Versões divergentes: package.json=$ROOT_VER apps/web/package.json=$WEB_VER"
            exit 1
          fi
          echo "version=$ROOT_VER" >> "$GITHUB_OUTPUT"
          echo "tag=v$ROOT_VER" >> "$GITHUB_OUTPUT"

      - name: Create tag and dispatch release
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          existing_sha=$(git ls-remote origin "refs/tags/$TAG^{}" | cut -f1 || true)
          if [ -n "$existing_sha" ]; then
            if [ "$existing_sha" = "$(git rev-parse HEAD)" ]; then
              echo "Tag $TAG já aponta para HEAD. Nada para publicar."
              exit 0
            fi
            echo "Tag $TAG já existe em outro commit ($existing_sha). Nenhuma nova release será criada."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"
          gh workflow run release.yml --ref "$TAG"

          {
            echo "## Release publicada"
            echo ""
            echo "- Tag: \`$TAG\`"
            echo "- Versão: \`$VERSION\`"
            echo ""
            echo "Abra uma PR de sync \`main → dev\` se dev ainda não contém o commit de release."
          } >> "$GITHUB_STEP_SUMMARY"
