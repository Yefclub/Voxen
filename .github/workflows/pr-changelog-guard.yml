# ============================================================================
# PR Changelog Guard — requires a changeset under changelog/unreleased/*.md
# ============================================================================
# Exempt: PRs that only touch .github/, docs/, root Markdown, LICENSE, dotfiles.
# Release PRs to main require a curated changelog/RELEASE.md.
# ============================================================================

name: PR Changelog Guard

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Require a changelog file
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -uo pipefail
          if [ "$BASE_REF" = "main" ]; then
            WATCH="changelog/RELEASE.md"
            IS_RELEASE=1
          else
            WATCH="changelog/unreleased"
            IS_RELEASE=0
          fi
          git fetch origin "$BASE_REF" --quiet 2>/dev/null || true
          BASE=$(git merge-base "origin/$BASE_REF" HEAD 2>/dev/null || echo "")
          if [ -z "$BASE" ]; then BASE=$(git rev-parse --verify -q HEAD~1 || echo ""); fi

          # Automatic version-dev PR: "set version to …" (plus legacy chore:)
          TITLE=$(gh pr view "${{ github.event.pull_request.number }}" --json title -q .title 2>/dev/null || echo "")
          if [ "$IS_RELEASE" = 0 ] && { [[ "$TITLE" == set\ version\ to\ * ]] || [[ "$TITLE" == chore:\ set\ version\ to\ * ]]; }; then
            echo "[changelog] version-dev PR is exempt."
            exit 0
          fi

          if [ "$IS_RELEASE" = 0 ] && [ -n "$BASE" ]; then
            ALL=$(git diff --name-only "$BASE" HEAD 2>/dev/null || echo "")
            if [ -z "$ALL" ]; then
              echo "[changelog] history-only reconciliation PR is exempt."
              exit 0
            fi
            NON_EXEMPT=0
            for f in $ALL; do
              case "$f" in
                .github/*|docs/*|*.md|.gitignore|.gitattributes|.editorconfig|.prettierignore|LICENSE*|changelog/*|releases.json|scripts/release-notes.mjs|package.json|apps/*/package.json) ;;
                *) NON_EXEMPT=1 ;;
              esac
            done
            if [ -n "$ALL" ] && [ "$NON_EXEMPT" = 0 ]; then
              echo "[changelog] infrastructure, CI, docs, or version-only PR is exempt."
              exit 0
            fi
          fi

          if [ -n "$BASE" ]; then
            CHANGED=$(git diff --name-only --diff-filter=AM "$BASE" HEAD -- "$WATCH")
          else
            CHANGED=$(git ls-files "$WATCH")
          fi
          MD=""
          for f in $CHANGED; do case "$f" in *.md) MD="$MD $f" ;; esac; done

          if [ -z "${MD// }" ]; then
            if [ "$IS_RELEASE" = 1 ]; then
              printf '%s\n' \
                "" \
                "===============================================================" \
                "RELEASE PR (dev→main) HAS NO PRODUCTION CHANGELOG." \
                "" \
                "A release requires a CURATED, user-facing changelog." \
                "Collect dev entries since the previous production release," \
                "filter internal noise, and highlight user-visible changes." \
                "" \
                "→ Create:  changelog/RELEASE.md" \
                "" \
                "  ---" \
                "  titulo: Voxen <version> — <release theme>" \
                "  ---" \
                "" \
                "  Markdown body grouped by theme rather than by PR." \
                "===============================================================" \
                "" >&2
              echo "::error::Release PR is missing curated changelog/RELEASE.md. See the log."
            else
              printf '%s\n' \
                "" \
                "===============================================================" \
                "THIS PR DOES NOT ADD A CHANGELOG FILE." \
                "" \
                "Every product change requires a user-facing entry under" \
                "changelog/unreleased/<slug>.md. Infrastructure, CI, and" \
                "documentation-only PRs are exempt." \
                "" \
                "→ Create ONE file:  changelog/unreleased/<descriptive-slug>.md" \
                "" \
                "  ---" \
                "  tipo: feat        # feat|fix|perf|ui|infra|security|chore" \
                "  titulo: Clear user-facing title" \
                "  ---" \
                "" \
                "  Markdown body: what changed, where it appears, and why." \
                "" \
                "Full format: changelog/README.md" \
                "===============================================================" \
                "" >&2
              echo "::error::PR has no changelog file. Create changelog/unreleased/<slug>.md."
            fi
            exit 1
          fi

          FAIL=0
          for f in $MD; do
            if ! RN_SOURCE="$f" node scripts/release-notes.mjs check; then FAIL=1; fi
          done
          if [ "$FAIL" != 0 ]; then
            echo "::error::Invalid changelog file: tipo/titulo frontmatter and a Markdown body are required."
            exit 1
          fi
          echo "[changelog] OK — a valid changelog is present."
