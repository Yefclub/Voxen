version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '04:00'
      timezone: 'America/Sao_Paulo'
    open-pull-requests-limit: 5
    groups:
      tooling:
        patterns:
          - 'eslint*'
          - 'prettier*'
          - 'typescript*'
          - '@types/*'
          - 'vite*'
          - 'vitest*'
      react:
        patterns:
          - 'react*'
          - '@vitejs/plugin-react*'

  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5

  - package-ecosystem: pip
    directory: /apps/chat
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      tooling:
        patterns:
          - 'ruff*'
          - 'mypy*'
          - 'pytest*'

  - package-ecosystem: pip
    directory: /apps/worker
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /apps/web
    schedule:
      interval: weekly
    open-pull-requests-limit: 3

  - package-ecosystem: docker
    directory: /apps/chat
    schedule:
      interval: weekly
    open-pull-requests-limit: 3

  - package-ecosystem: docker
    directory: /apps/worker
    schedule:
      interval: weekly
    open-pull-requests-limit: 3

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
