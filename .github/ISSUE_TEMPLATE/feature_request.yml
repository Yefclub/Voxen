name: Feature request
description: Propose a new capability or product improvement.
title: "feat: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or opportunity
      description: Which problem does this solve, and for whom?
      placeholder: Today, when ..., it is difficult because ...
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How should the solution behave?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Are there simpler approaches or external solutions?
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: Primary area
      options:
        - Web/API
        - Chat
        - Worker/transcription
        - Deployment/infrastructure
        - Security
        - Documentation
        - Other
    validations:
      required: true
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues before opening this request.
          required: true
        - label: I understand that larger features may require a specification before implementation.
          required: true
