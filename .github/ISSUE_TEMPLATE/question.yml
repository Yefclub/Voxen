name: Question
description: Ask about usage, deployment, or development.
title: "question: "
labels: ["question"]
body:
  - type: textarea
    id: question
    attributes:
      label: Question
      description: Be specific about what you tried and where you are blocked.
    validations:
      required: true
  - type: dropdown
    id: topic
    attributes:
      label: Topic
      options:
        - Installation
        - Proxmox CT/LXC
        - Docker Compose
        - Easypanel
        - Application usage
        - Development
        - Other
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Environment, version, logs without secrets, and links to documentation you consulted.
    validations:
      required: false
