# ============================================================================
# Garage — config mínima para 1 nó standalone (dev e self-hosted simples)
# ============================================================================
# Em produção com HA: aumentar replication_factor e configurar múltiplos nós.

metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"

db_engine = "lmdb"

replication_factor = 1

rpc_bind_addr = "[::]:3901"
rpc_public_addr = "127.0.0.1:3901"
rpc_secret = "${GARAGE_RPC_SECRET}"

[s3_api]
s3_region = "garage"
api_bind_addr = "[::]:3900"
root_domain = ".s3.voxen.local"

[s3_web]
bind_addr = "[::]:3902"
root_domain = ".web.voxen.local"
index = "index.html"

[k2v_api]
api_bind_addr = "[::]:3904"

[admin]
api_bind_addr = "[::]:3903"
admin_token = "${GARAGE_ADMIN_TOKEN}"
